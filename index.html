<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Finance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f6f9;--surface:#fff;--surface2:#f0f3f8;--surface3:#e8ecf3;
  --border:#dde2ec;--border2:#c8d0df;
  --accent:#2563eb;--accent-h:#1d4ed8;--accent-dim:rgba(37,99,235,0.08);
  --green:#16a34a;--green-dim:rgba(22,163,74,0.09);
  --red:#dc2626;--red-dim:rgba(220,38,38,0.08);
  --orange:#ea580c;--orange-dim:rgba(234,88,12,0.09);
  --yellow:#b45309;--yellow-dim:rgba(180,83,9,0.09);
  --blue:#2563eb;--blue-dim:rgba(37,99,235,0.09);
  --purple:#7c3aed;--purple-dim:rgba(124,58,237,0.09);
  --text:#111827;--text2:#374151;--muted:#6b7280;--muted2:#9ca3af;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 4px rgba(0,0,0,0.07),0 4px 16px rgba(0,0,0,0.04);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;}

/* LOGIN */
#login-wrap{display:none;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:100%;max-width:400px;box-shadow:var(--shadow);}
.login-logo{font-weight:800;font-size:22px;color:var(--accent);letter-spacing:-0.8px;margin-bottom:6px;}
.login-logo span{color:var(--text);}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
.login-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.login-group label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);}
.login-inp{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;width:100%;transition:border-color .15s;}
.login-inp:focus{outline:none;border-color:var(--accent);}
.login-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:8px;transition:all .15s;}
.login-btn:hover{background:var(--accent-h);}
.login-err{font-size:12px;color:var(--red);margin-top:8px;display:none;}

/* LOADING */
#loading-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;gap:16px;height:58px;position:sticky;top:0;z-index:200;box-shadow:var(--shadow-sm);}
.nav-logo{font-weight:800;font-size:18px;color:var(--accent);letter-spacing:-0.8px;}
.nav-logo span{color:var(--text);}
.nav-center{display:flex;align-items:center;gap:8px;margin:0 auto;}
.nav-back{display:none;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:7px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.nav-back:hover{border-color:var(--accent);color:var(--accent);}
.nav-page-title{font-size:15px;font-weight:700;color:var(--text2);}
.nav-right{display:flex;align-items:center;gap:8px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;}
.sync-dot.syncing{background:var(--yellow);animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-logout{padding:7px 14px;background:none;border:1px solid var(--border2);border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}

/* APP */
#app{display:none;}
.page{display:none;padding:26px 28px 60px;max-width:1280px;margin:0 auto;}
.page.active{display:block;}

/* HOME TILES */
.home-greeting{font-size:22px;font-weight:800;margin-bottom:6px;letter-spacing:-0.5px;}
.home-sub{font-size:14px;color:var(--muted);margin-bottom:28px;}
.home-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.1);border-color:var(--accent);}
.tile-icon{font-size:32px;margin-bottom:14px;}
.tile-title{font-size:17px;font-weight:800;margin-bottom:6px;}
.tile-count{font-size:13px;color:var(--muted);margin-bottom:16px;}
.tile-stat{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;}
.tile-accent{position:absolute;top:0;left:0;right:0;height:4px;}
.tile.chit .tile-accent{background:var(--accent);}
.tile.ins .tile-accent{background:var(--green);}
.tile.tax .tile-accent{background:var(--orange);}
.tile.chit .tile-stat{color:var(--accent);}
.tile.ins .tile-stat{color:var(--green);}
.tile.tax .tile-stat{color:var(--orange);}

/* DUE BANNER */
.due-banner{background:#fefce8;border:1px solid #fcd34d;border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:18px;font-size:13px;color:#713f12;display:none;}
.due-banner.show{display:block;}
.due-banner strong{display:block;font-size:13px;margin-bottom:6px;}
.due-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #fde68a;}
.due-item:last-child{border-bottom:none;}

/* SEC HEADER */
.sec-hd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.sec-hd::after{content:'';flex:1;height:1px;background:var(--border);}
.badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0;}

/* STAT STRIPS */
.strip{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow-sm);}
.strip-4{grid-template-columns:repeat(4,1fr);}
.strip-3{grid-template-columns:repeat(3,1fr);}
.scell{background:var(--surface);padding:16px 20px;position:relative;}
.scell::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.c-blue::before{background:var(--blue);}.c-green::before{background:var(--green);}
.c-red::before{background:var(--red);}.c-orange::before{background:var(--orange);}
.c-yellow::before{background:var(--yellow);}.c-purple::before{background:var(--purple);}
.sl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;color:var(--muted);margin-bottom:7px;}
.sv{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;line-height:1;color:var(--text);}
.sv.c-blue{color:var(--blue);}.sv.c-green{color:var(--green);}.sv.c-red{color:var(--red);}
.sv.c-orange{color:var(--orange);}.sv.c-yellow{color:var(--yellow);}.sv.c-purple{color:var(--purple);}
.ss{font-size:11px;color:var(--muted);margin-top:5px;}

/* CARD GRID */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);transition:all .15s;}
.card:hover{border-color:var(--border2);box-shadow:var(--shadow);}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.card-name{font-weight:700;font-size:15px;}
.card-type{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;}
.card-type.health{background:var(--green-dim);color:var(--green);}
.card-type.vehicle{background:var(--blue-dim);color:var(--blue);}
.card-type.life{background:var(--purple-dim);color:var(--purple);}
.card-type.other{background:var(--surface2);color:var(--muted);}
.card-type.property{background:var(--orange-dim);color:var(--orange);}
.card-type.municipal{background:var(--yellow-dim);color:var(--yellow);}
.card-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.card-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;}
.card-row-label{color:var(--muted);font-size:12px;}
.card-row-val{font-weight:600;font-family:'JetBrains Mono',monospace;}
.card-actions{display:flex;gap:8px;}
.due-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.due-pill.safe{background:var(--green-dim);color:var(--green);}
.due-pill.soon{background:var(--yellow-dim);color:var(--yellow);}
.due-pill.urgent{background:var(--red-dim);color:var(--red);}
.due-pill.overdue{background:var(--red-dim);color:var(--red);}

/* CHIT ROWS */
.chit-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm);}
.chit-row:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(37,99,235,0.12);transform:translateY(-1px);}
.chit-row.is-new{border-color:var(--accent);background:var(--accent-dim);animation:rowIn .4s cubic-bezier(.34,1.4,.64,1) both;}
@keyframes rowIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.crow-id{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);white-space:nowrap;}
.crow-name{font-weight:700;font-size:14px;}
.crow-company{font-size:11px;color:var(--muted);}
.crow-meta{display:flex;align-items:center;gap:18px;margin-left:auto;}
.cm-i .cml{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);}
.cm-i .cmv{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;}
.crow-prog{display:flex;align-items:center;gap:8px;}
.prog-track{width:80px;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),#7c3aed);border-radius:3px;}
.prog-text{font-size:11px;color:var(--muted);white-space:nowrap;}

/* STATUS PILLS */
.spill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.spill.scomp{background:var(--green-dim);color:var(--green);}
.spill.sact{background:var(--blue-dim);color:var(--blue);}
.spill.sprz{background:var(--orange-dim);color:var(--orange);}
.sdot{width:5px;height:5px;border-radius:50%;background:currentColor;}

/* DETAIL */
.detail-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow-sm);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.detail-hero-left h1{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.detail-hero-left .sub{font-size:13px;color:var(--muted);margin-top:4px;}
.detail-hero-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px;}
.dc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;box-shadow:var(--shadow-sm);}
.dl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);margin-bottom:5px;}
.dv{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--text);}
.dv.g{color:var(--green);}.dv.r{color:var(--red);}.dv.b{color:var(--blue);}
.dv.o{color:var(--orange);}.dv.y{color:var(--yellow);}

/* TABLE */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:18px;overflow-x:auto;}
.itbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px;}
.itbl th{text-align:left;padding:9px 13px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;}
.itbl td{padding:9px 13px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
.itbl tr:last-child td{border-bottom:none;}
.itbl tbody tr:hover td{background:var(--surface2);}
tr.rp td{background:rgba(22,163,74,0.04);}
tr.rz td{background:rgba(234,88,12,0.06);}
tr.ro td{background:rgba(220,38,38,0.04);}
tr.rn td{background:rgba(180,83,9,0.06);}
.ck{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--border2);background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;color:var(--green);}
.ck.on{border-color:var(--green);background:var(--green-dim);}
.ck:hover{border-color:var(--green);}
.inp-n{background:transparent;border:1px solid transparent;padding:4px 6px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;width:110px;border-radius:5px;text-align:right;}
.inp-n:hover{border-color:var(--border2);}
.inp-n:focus{outline:none;border-color:var(--accent);background:var(--surface2);}
.inp-n::placeholder{color:var(--muted2);}
.inp-r{background:transparent;border:1px solid transparent;padding:4px 6px;color:var(--muted);font-family:'Inter',sans-serif;font-size:12px;width:120px;border-radius:5px;}
.inp-r:hover{border-color:var(--border2);}
.inp-r:focus{outline:none;border-color:var(--accent);background:var(--surface2);color:var(--text);}

/* VISUALS */
.vsummary{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;}
.vcrd{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm);}
.vcrd-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:16px;}
.chit-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.chit-bar-row:last-child{margin-bottom:0;}
.chit-bar-label{font-size:12px;font-weight:600;color:var(--text2);width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.chit-bar-track{flex:1;height:8px;background:var(--surface3);border-radius:4px;overflow:hidden;}
.chit-bar-fill{height:100%;border-radius:4px;}
.chit-bar-pct{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);width:34px;text-align:right;flex-shrink:0;}
.netpos-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.netpos-row:last-child{border-bottom:none;}
.netpos-bar-track{height:4px;background:var(--surface3);border-radius:2px;margin-top:4px;overflow:hidden;}
.netpos-bar-fill{height:100%;border-radius:2px;}

/* BUTTONS */
.btn{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:var(--accent-h);}
.btn-ghost{background:none;border:1px solid var(--border2);color:var(--text2);}.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-green{background:var(--green);color:#fff;}.btn-green:hover{background:#15803d;}
.btn-danger{background:none;border:1px solid var(--border2);color:var(--red);}.btn-danger:hover{background:var(--red-dim);border-color:var(--red);}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:7px;}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:300;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.2);}
.mhd{padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between;}
.mhd h2{font-size:17px;font-weight:800;}
.mx{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;}
.mbody{padding:20px 24px 24px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.ffull{grid-column:1/-1;}
.fgroup{display:flex;flex-direction:column;gap:6px;}
.fgroup label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);}
.finp{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 13px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;transition:border-color .15s;width:100%;}
.finp:focus{outline:none;border-color:var(--accent);}
.mft{padding:0 24px 24px;display:flex;gap:10px;justify-content:flex-end;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);padding:12px 18px;border-radius:9px;font-size:13px;z-index:999;transform:translateY(60px);opacity:0;transition:all .25s;pointer-events:none;box-shadow:var(--shadow);font-weight:500;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{border-color:var(--green);color:var(--green);}
.toast.err{border-color:var(--red);color:var(--red);}

.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-icon{font-size:44px;margin-bottom:14px;}
.arrow-icon{font-size:14px;color:var(--muted2);margin-left:6px;}

@media(max-width:900px){.home-tiles{grid-template-columns:1fr}.strip-4{grid-template-columns:1fr 1fr}.vsummary{grid-template-columns:1fr}}
@media(max-width:640px){nav{padding:0 14px}.page{padding:16px 14px 50px}.fg{grid-template-columns:1fr}.crow-meta{display:none}}
</style>
</head>
<body>

<div id="loading-wrap"><div class="spinner"></div></div>
<div id="login-wrap">
  <div class="login-card">
    <div class="login-logo">Family<span>Finance</span></div>
    <div class="login-sub">Sign in to manage your family finances</div>
    <div class="login-group"><label>Email</label><input class="login-inp" type="email" id="l-email" placeholder="family@example.com" autocomplete="email"></div>
    <div class="login-group"><label>Password</label><input class="login-inp" type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <nav>
    <div class="nav-logo">Family<span>Finance</span></div>
    <div class="nav-center">
      <button class="nav-back" id="nav-back" onclick="goBack()">← Back</button>
      <span class="nav-page-title" id="nav-title"></span>
    </div>
    <div class="nav-right">
      <span style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px">
        <span class="sync-dot" id="sync-dot"></span><span id="sync-label">Synced</span>
      </span>
      <button class="btn-logout" onclick="doLogout()">Sign Out</button>
    </div>
  </nav>

  <!-- HOME -->
  <div class="page active" id="page-home">
    <div style="padding:26px 28px 60px;max-width:1280px;margin:0 auto">
      <div class="home-greeting">Welcome back!</div>
      <div class="due-banner" id="due-banner"><strong>🔔 Upcoming Payments (within 30 days)</strong><div id="due-items"></div></div>
      <div class="home-tiles" id="home-tiles"></div>
      <div style="text-align:right;margin-top:8px">
        <button class="btn btn-ghost btn-sm" onclick="exportCalendar()">📅 Export All to Calendar</button>
      </div>
    </div>
  </div>

  <!-- CHIT OVERVIEW -->

setSyncing=(v)=>{
  document.getElementById('sync-dot').className='sync-dot'+(v?' syncing':'');

};

async function loadDB(){
  try {
    const { data, error } = await sb.from('chits').select('*').limit(1).single();
    if(error){ console.error('Load error:',error); return; }
    if(data){
      dbRowId=data.id;
      const d = data.data;
      if(Array.isArray(d)) DB={ chits:d, seq:data.seq||0, insurance:[], taxes:[] };
      else { DB=d; if(!DB.chits) DB.chits=[]; if(!DB.insurance) DB.insurance=[]; if(!DB.taxes) DB.taxes=[]; DB.seq=data.seq||DB.seq||0; }
    }
  } catch(e){ console.error('loadDB error:',e); }
}

async function saveDB(){

    if(error) toast('Sync error: '+error.message,'err');

}

// ─── DUE SOON ────────────────────────────────────────────────────
function checkDueSoon(){
  const today=new Date(); today.setHours(0,0,0,0);
  const in30=new Date(today); in30.setDate(in30.getDate()+30);
  const items=[];

  // Chits
  (DB.chits||[]).forEach(c=>{
    const next=c.installments?.find(i=>!i.paid);
    if(!next) return;
    const due=new Date(next.dueDate); due.setHours(0,0,0,0);
    const diff=Math.round((due-today)/(1000*60*60*24));
    if(diff<=30&&diff>=0) items.push({label:`Chit: ${c.name}`,date:next.dueDate,amt:next.amountDue,diff,icon:'💰'});
  });

  // Insurance
  (DB.insurance||[]).forEach(ins=>{
    const next=ins.payments&&ins.payments.find(p=>!p.paid);
    if(!next||!next.dueDate) return;
    const due=new Date(next.dueDate); due.setHours(0,0,0,0);
    const diff=Math.round((due-today)/(1000*60*60*24));
    if(diff<=30&&diff>=0) items.push({label:`Insurance: ${ins.name}`,date:next.dueDate,amt:next.amountDue,diff,icon:'🛡️'});
  });

  // Tax
  (DB.taxes||[]).forEach(tax=>{
    const next=tax.payments&&tax.payments.find(p=>!p.paid);
    if(!next||!next.dueDate) return;
    const due=new Date(next.dueDate); due.setHours(0,0,0,0);
    const diff=Math.round((due-today)/(1000*60*60*24));
    if(diff<=30&&diff>=0) items.push({label:`Tax: ${tax.name}`,date:next.dueDate,amt:next.amountDue,diff,icon:'🏛️'});
  });

  items.sort((a,b)=>a.diff-b.diff);

  const banner=document.getElementById('due-banner');
  const dueDiv=document.getElementById('due-items');
  if(items.length){
    dueDiv.innerHTML=items.map(i=>`<div class="due-item">
      <span>${i.icon} <strong>${i.label}</strong> — ${i.diff===0?'<b>today</b>':i.diff===1?'<b>tomorrow</b>':`in <b>${i.diff} days</b>`} (${i.date})</span>
      <span style="font-family:JetBrains Mono,monospace;font-weight:700">₹${fN(i.amt)}</span>
    </div>`).join('');
    banner.classList.add('show');
    if(Notification.permission==='granted'){
      items.filter(i=>i.diff<=7).forEach(i=>{
        new Notification('FamilyFinance — Payment Due',{
          body:`${i.label}: ₹${fN(i.amt)} due ${i.diff===0?'today':i.diff===1?'tomorrow':'in '+i.diff+' days'}`
        });
      });
    }
  } else banner.classList.remove('show');
}

// ─── CALENDAR EXPORT ─────────────────────────────────────────────
function exportCalendar(){
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FamilyFinance//EN','CALSCALE:GREGORIAN'];

  const addEvent=(uid,date,summary,desc)=>{
    const d=date.replace(/-/g,'');
    lines.push('BEGIN:VEVENT',`UID:${uid}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${d}`,
      `SUMMARY:${summary}`,`DESCRIPTION:${desc}`,
      'BEGIN:VALARM','TRIGGER:-P3D','ACTION:DISPLAY',`DESCRIPTION:${summary}`,'END:VALARM',
      'END:VEVENT');
  };

  (DB.chits||[]).forEach(c=>{
    c.installments?.forEach(inst=>{
      if(inst.paid) return;
      addEvent(`chit-${c.id}-mo${inst.monthNo}@ff`,inst.dueDate,
        `Chit: ${c.name} — ₹${fN(inst.amountDue)}`,
        `Chit: ${c.name} (${c.id})\\nMonth ${inst.monthNo} of ${c.totalMonths}\\nAmount: ₹${fN(inst.amountDue)}`);
    });
  });

  (DB.insurance||[]).forEach(ins=>{
    (ins.payments||[]).forEach((p,i)=>{
      if(p.paid||!p.dueDate) return;
      addEvent(`ins-${ins.id}-p${i}@ff`,p.dueDate,
        `Insurance: ${ins.name} — ₹${fN(p.amountDue)}`,
        `Policy: ${ins.name}\\nProvider: ${ins.provider||''}\\nAmount Due: ₹${fN(p.amountDue)}`);
    });
  });

  (DB.taxes||[]).forEach(tax=>{
    (tax.payments||[]).forEach((p,i)=>{
      if(p.paid||!p.dueDate) return;
      addEvent(`tax-${tax.id}-p${i}@ff`,p.dueDate,
        `Tax: ${tax.name} — ₹${fN(p.amountDue)}`,
        `Tax: ${tax.name}\\nAmount: ₹${fN(p.amountDue)}\\nOffice: ${tax.office||''}`);
    });
  });

  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='family_finance_dues.ics'; a.click();
  toast('Calendar downloaded — import into Google/Apple Calendar ✓','ok');
}

// ─── CHIT LOGIC ──────────────────────────────────────────────────
function nextChitId(){ DB.seq=(DB.seq||0)+1; return 'CHIT-'+String(DB.seq).padStart(3,'0'); }
function monthlyDue(c){ return Math.round(c.amount/c.totalMonths); }
function calcDividend(c,bid){ return Math.max(0,Math.round((c.amount-bid-(c.commission||0))/c.members)); }

function recomputeInstallments(c){
  const base=monthlyDue(c); let pending=0;
  c.installments.forEach(inst=>{
    // Apply any pending profit to THIS month's due
    const deduct=Math.min(pending,base);
    inst.amountDue=base-deduct; pending=Math.max(0,pending-deduct);
    // Dividend applies to ALL months with a bid — whether you won or not
    // You are still a member, so you still get the split
    if(inst.bidAmount>0){
      inst.dividend=calcDividend(c,inst.bidAmount);
      // Carry forward only after this month is paid
      if(inst.paid) pending+=inst.dividend;
    } else {
      inst.dividend=0;
    }
  });
}

function calcChit(c){
  const paid=c.installments?.filter(i=>i.paid)||[];
  const mp=paid.length, tp=paid.reduce((s,i)=>s+i.amountDue,0);
  const td=c.installments?.reduce((s,i)=>s+(i.dividend||0),0)||0;
  const ml=c.totalMonths-mp, pr=c.prizeReceived||0;
  const nco=tp-pr, np=pr+td-tp, roi=tp>0?(np/tp*100):0;
  const tcl=c.installments?.filter(i=>!i.paid).reduce((s,i)=>s+i.amountDue,0)||0;
  const iWonAny=c.installments?.some(i=>i.iWon)||false;
  let status='Active';
  if(mp>=c.totalMonths) status='Completed';
  else if(iWonAny) status='Active - Prize Taken';
  const nextU=c.installments?.find(i=>!i.paid);
  return {monthsPaid:mp,totalPaid:tp,totalDividend:td,monthsLeft:ml,netCashOutflow:nco,netPosition:np,roi,status,nextUnpaid:nextU,totalCommitmentLeft:tcl,prizeReceived:pr};
}

function makeChit(id,name,company,contact,phone,amount,members,months,commission,startDate){
  const insts=[],base=new Date(startDate),mDue=Math.round(parseFloat(amount)/parseInt(months));
  for(let i=0;i<parseInt(months);i++){
    const dt=new Date(base); dt.setMonth(dt.getMonth()+i);
    insts.push({monthNo:i+1,dueDate:dt.toISOString().split('T')[0],amountDue:mDue,bidAmount:0,dividend:0,paid:false,remarks:'',iWon:false});
  }
  return {id,name,company,contact,phone,amount:parseFloat(amount),members:parseInt(members),
          totalMonths:parseInt(months),commission:parseFloat(commission)||0,startDate,prizeReceived:0,installments:insts};
}

async function chitTogglePaid(cid,idx){
  const c=DB.chits.find(x=>x.id===cid); if(!c)return;
  c.installments[idx].paid=!c.installments[idx].paid;
  recomputeInstallments(c);
  await saveDB(); renderChitDetail(c); checkDueSoon();
  toast(c.installments[idx].paid?'✓ Paid — profit carried forward':'Unmarked','ok');
}
async function chitRecordBid(cid,idx,val){
  const c=DB.chits.find(x=>x.id===cid); if(!c)return;
  c.installments[idx].bidAmount=parseFloat(val)||0;
  recomputeInstallments(c);
  await saveDB(); renderChitDetail(c);
  if(val>0){ toast(`Bid ₹${fN(val)} → Dividend ₹${fN(c.installments[idx].dividend)} → next month after Paid`,'ok'); }
}
async function chitSaveField(cid,idx,f,v){ const c=DB.chits.find(x=>x.id===cid);if(!c)return; c.installments[idx][f]=v; await saveDB(); }
async function chitToggleIWon(cid,idx,checked){
  const c=DB.chits.find(x=>x.id===cid); if(!c)return;
  const already=c.installments.findIndex(i=>i.iWon);
  if(checked&&already>=0&&already!==idx){ toast('You can only win once per chit.','err'); renderChitDetail(c); return; }
  c.installments[idx].iWon=checked;
  c.prizeReceived=checked?(c.installments[idx].bidAmount||0):0;
  recomputeInstallments(c);
  await saveDB(); renderChitDetail(c);
  toast(checked?`Month ${c.installments[idx].monthNo} — marked as your win!`:'Unmarked','ok');
}
async function deleteChit(cid){
  if(!confirm('Delete this chit permanently?')) return;
  DB.chits=DB.chits.filter(c=>c.id!==cid);
  await saveDB(); navTo('chits','Chit Funds'); renderChitsPage(); toast('Chit deleted','');
}

  if(!taxes.length){ grid.innerHTML='<div class="empty"><div class="empty-icon">🏛️</div><p>No taxes yet. Click <strong>+ Add Tax</strong> to begin.</p></div>'; return; }

  grid.innerHTML=taxes.map(tax=>{
    const payments=tax.payments||[];
    const nextDue=payments.find(p=>!p.paid);
    const dp=nextDue?duePill(nextDue.dueDate):`<span style="color:var(--muted2);font-size:12px">No upcoming payment</span>`;

    const historyRows=payments.length?payments.map((p,pidx)=>`
      <tr style="background:${p.paid?'rgba(22,163,74,0.04)':''}">
        <td style="font-size:12px;color:var(--muted)">${p.dueDate||'—'}</td>
        <td style="font-family:JetBrains Mono,monospace">₹${fN(p.amountDue)}</td>
        <td style="font-family:JetBrains Mono,monospace;color:${p.amountPaid?'var(--green)':'var(--muted2)'}">
          ${p.paid?'₹'+fN(p.amountPaid):'—'}
        </td>
        <td style="font-size:12px;color:var(--muted)">${p.paidDate||'—'}</td>
        <td>
          <button class="ck ${p.paid?'on':''}" onclick="taxTogglePaid('${tax.id}',${pidx})">${p.paid?'✓':''}</button>
        </td>
        <td style="font-size:12px;color:var(--muted)">${p.notes||''}</td>
        <td><button onclick="deleteTaxPayment('${tax.id}',${pidx})" style="background:none;border:none;cursor:pointer;color:var(--muted2);font-size:14px">×</button></td>
      </tr>`).join('')
    :`<tr><td colspan="7" style="text-align:center;color:var(--muted2);font-size:12px;padding:12px">No payment history yet</td></tr>`;

    return`<div class="card" style="grid-column:1/-1">
      <div class="card-top">
        <div>
          <div class="card-name">${tax.name}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${tax.office||''} ${tax.assessNo?'· Ref: '+tax.assessNo:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="card-type ${tax.type||'other'}">${taxTypeLabel(tax.type)}</span>
          <button class="btn btn-ghost btn-sm" onclick="openTaxModal('${tax.id}')">✏️ Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteTax('${tax.id}')">🗑</button>
        </div>
      </div>

      <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--surface2);border-radius:var(--radius-sm)">
        <div><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Frequency</div><div style="font-size:13px;font-weight:600">${tax.freq||'Yearly'}</div></div>
        <div><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Next Due</div><div>${dp}</div></div>
        ${nextDue?`<div><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Amount Due</div><div style="font-family:JetBrains Mono,monospace;font-size:13px;font-weight:700;color:var(--orange)">₹${fN(nextDue.amountDue)}</div></div>`:''}
        ${tax.notes?`<div><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px">Notes</div><div style="font-size:12px;color:var(--muted)">${tax.notes}</div></div>`:''}
      </div>

      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:8px">Payment History</div>
      <div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:12px">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="background:var(--surface2)">
            <th style="text-align:left;padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);border-bottom:1px solid var(--border)">Due Date</th>
            <th style="text-align:left;padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);border-bottom:1px solid var(--border)">Amount Due</th>
            <th style="text-align:left;padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);border-bottom:1px solid var(--border)">Amount Paid</th>
            <th style="text-align:left;padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);border-bottom:1px solid var(--border)">Paid Date</th>
            <th style="text-align:left;padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);border-bottom:1px solid var(--border)">Paid?</th>
            <th style="text-align:left;padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);border-bottom:1px solid var(--border)">Notes</th>
            <th style="border-bottom:1px solid var(--border)"></th>
          </tr></thead>
          <tbody>${historyRows}</tbody>
        </table>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="openTaxPaymentModal('${tax.id}')">＋ Add Payment Entry</button>
    </div>`;
  }).join('');
}

function openChitModal(cid){
  editChitId=cid||null;
  document.getElementById('chit-modal-title').textContent=cid?'Edit Chit':'Add New Chit';
  if(cid){
    const c=DB.chits.find(x=>x.id===cid); if(!c)return;
    document.getElementById('cf-name').value=c.name;
    document.getElementById('cf-company').value=c.company||'';
    document.getElementById('cf-contact').value=c.contact||'';
    document.getElementById('cf-phone').value=c.phone||'';
    document.getElementById('cf-amount').value=c.amount;
    document.getElementById('cf-members').value=c.members||'';
    document.getElementById('cf-months').value=c.totalMonths;
    document.getElementById('cf-commission').value=c.commission||'';
    document.getElementById('cf-startdate').value=c.startDate;
  } else {
    ['cf-name','cf-company','cf-contact','cf-phone','cf-amount','cf-members','cf-months','cf-commission'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('cf-startdate').value=new Date().toISOString().split('T')[0];

}

async function saveChit(){
  const name=document.getElementById('cf-name').value.trim();
  const company=document.getElementById('cf-company').value.trim(),contact=document.getElementById('cf-contact').value.trim(),phone=document.getElementById('cf-phone').value.trim();
  const amount=parseFloat(document.getElementById('cf-amount').value),members=parseInt(document.getElementById('cf-members').value);
  const months=parseInt(document.getElementById('cf-months').value),commission=parseFloat(document.getElementById('cf-commission').value)||0;
  const startDate=document.getElementById('cf-startdate').value;
  if(!name||!amount||!members||!months||!startDate){ toast('Fill all required fields','err'); return; }
  if(!DB.chits) DB.chits=[];
  if(editChitId){ const i=DB.chits.findIndex(c=>c.id===editChitId); if(i>=0) Object.assign(DB.chits[i],{name,company,contact,phone,commission}); }
  else { const id=nextChitId(); DB.chits.push(makeChit(id,name,company,contact,phone,amount,members,months,commission,startDate)); }
  await saveDB(); closeModal('chit-modal');
  renderChitsPage(); renderHome();
  toast(editChitId?'Chit updated ✓':'Chit added ✓','ok'); editChitId=null;
}

// ─── EXCEL EXPORT ────────────────────────────────────────────────
function exportChitExcel(cid){
  const c=DB.chits.find(x=>x.id===cid); if(!c)return;
  const r=calcChit(c), base=monthlyDue(c);
  const summary=[['FamilyFinance — Chit Detail'],[],['Field','Value'],['Chit ID',c.id],['Name',c.name],['Company',c.company||''],['Amount',c.amount],['Members',c.members],['Commission/mo',c.commission],['Base Installment',base],['Total Months',c.totalMonths],['Months Paid',r.monthsPaid],['Total Paid',r.totalPaid],['Dividends Saved',r.totalDividend],['Net Position',r.netPosition],['Status',r.status]];
  const instH=['Mo#','Due Date','Base','Winning Bid','Dividend','You Pay','Paid?','I Won?','Remarks'];
  const instR=c.installments.map(i=>[i.monthNo,i.dueDate,base,i.bidAmount||0,i.dividend||0,i.amountDue,i.paid?'Yes':'No',i.iWon?'Yes':'No',i.remarks||'']);
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet(summary); XLSX.utils.book_append_sheet(wb,ws1,'Summary');
  const ws2=XLSX.utils.aoa_to_sheet([instH,...instR]); XLSX.utils.book_append_sheet(wb,ws2,'Installments');
  XLSX.writeFile(wb,`${c.id}_${c.name.replace(/\s+/g,'_')}.xlsx`); toast('Excel downloaded ✓','ok');
}

// ─── HELPERS ─────────────────────────────────────────────────────
function show(id,display='block'){ document.getElementById(id).style.display=display; }
function hide(id){ document.getElementById(id).style.display='none'; }
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function fN(n){ if(n==null)return'0'; const a=Math.abs(n); return(n<0?'-':'')+a.toLocaleString('en-IN'); }
function sPill(s){
  if(s==='Completed') return`<span class="spill scomp"><span class="sdot"></span>Completed</span>`;
  if(s.includes('Prize Taken')) return`<span class="spill sprz"><span class="sdot"></span>Prize Taken</span>`;
  return`<span class="spill sact"><span class="sdot"></span>Active</span>`;
}
function toast(msg,type){ const el=document.getElementById('toast'); el.textContent=msg; el.className='toast show '+(type||''); setTimeout(()=>el.classList.remove('show'),2800); }

function duePill(dateStr){
  if(!dateStr) return`<span style="color:var(--muted2);font-size:12px">—</span>`;
  const today=new Date(); today.setHours(0,0,0,0);
  const due=new Date(dateStr); due.setHours(0,0,0,0);
  const diff=Math.round((due-today)/(1000*60*60*24));
  if(diff<0) return`<span class="due-pill overdue">Overdue ${Math.abs(diff)}d</span>`;
  if(diff===0) return`<span class="due-pill urgent">Due Today</span>`;
  if(diff<=7) return`<span class="due-pill urgent">In ${diff}d</span>`;
  if(diff<=30) return`<span class="due-pill soon">In ${diff}d</span>`;
  return`<span class="due-pill safe">${dateStr}</span>`;
}

function typeLabel(t){ return({health:'Health',vehicle:'Vehicle',life:'Life',other:'Other'})[t]||'Other'; }
function taxTypeLabel(t){ return({property:'Property',municipal:'Municipal',vehicle:'Vehicle Tax',income:'Income Tax',other:'Other'})[t]||'Other'; }

let currentInsPaymentId = null;
let currentTaxPaymentId = null;

function openInsPaymentModal(polId){
  currentInsPaymentId = polId;
  ['ip-due','ip-amtdue','ip-amtpaid','ip-paiddate','ip-notes'].forEach(id=>document.getElementById(id).value='');
  openModal('ins-payment-modal');
}

async function saveInsPayment(){
  const dueDate=document.getElementById('ip-due').value;
  const amtDue=parseFloat(document.getElementById('ip-amtdue').value);
  if(!dueDate||!amtDue){ toast('Due date and amount are required','err'); return; }
  const pol=DB.insurance.find(x=>x.id===currentInsPaymentId); if(!pol)return;
  if(!pol.payments) pol.payments=[];
  const amtPaid=parseFloat(document.getElementById('ip-amtpaid').value)||0;
  const paidDate=document.getElementById('ip-paiddate').value;
  pol.payments.push({ dueDate, amountDue:amtDue, amountPaid:amtPaid||0, paidDate, paid:!!(amtPaid&&paidDate), notes:document.getElementById('ip-notes').value });
  pol.payments.sort((a,b)=>a.dueDate>b.dueDate?1:-1);
  await saveDB(); closeModal('ins-payment-modal'); renderInsPage(); checkDueSoon();
  toast('Payment entry added ✓','ok');
}

async function insTogglePaid(polId, pidx){
  const pol=DB.insurance.find(x=>x.id===polId); if(!pol||!pol.payments[pidx])return;
  const p=pol.payments[pidx];
  p.paid=!p.paid;
  if(p.paid && !p.paidDate) p.paidDate=new Date().toISOString().split('T')[0];
  if(p.paid && !p.amountPaid) p.amountPaid=p.amountDue;
  await saveDB(); renderInsPage(); checkDueSoon();
  toast(p.paid?'✓ Marked as paid':'Unmarked','ok');
}

async function deleteInsPayment(polId, pidx){
  const pol=DB.insurance.find(x=>x.id===polId); if(!pol)return;
  pol.payments.splice(pidx,1);
  await saveDB(); renderInsPage(); toast('Entry deleted','');
}
